# ADR-010: quick AI evals on pull requests that touch the AI pipeline. CI has no model key, so
# AI_PROVIDER=demo runs the deterministic demo engine; schema validity and clarifying questions block.
name: AI evals

on:
  pull_request:
    paths:
      - "src/ai/**"
      - "tests/ai-evals/**"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Evals (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:quick
        env:
          AI_PROVIDER: demo
